<div class="d-flex justify-content-end whiteBG pe-3 ps-3 pb-2 pt-2">

  <nav aria-label="Page navigation example">
      <ul class="pagination pagination-sm mb-0">
          <!-- Previous Button -->
          <li class="page-item">
              <a class="page-link" href="javascript: void(0);" (click)="goToPage('prev')" tabindex="-1">
                <i class="bi bi-arrow-left"></i>
              </a>
          </li>

          <!-- Dynamic Page Numbers -->
          <li class="page-item" *ngFor="let page of pageNumbers" [class.active]="page === currentPage">
              <a class="page-link" href="javascript: void(0);" (click)="goToPage(page)">
                  {{ page }}
              </a>
          </li>

          <!-- Next Button -->
          <li class="page-item">
              <a class="page-link" href="javascript: void(0);" (click)="goToPage('next')">
                <i class="bi bi-arrow-right"></i>
              </a>
          </li>
      </ul>
  </nav>
</div>
